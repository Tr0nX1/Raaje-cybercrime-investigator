<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraud Flow Graph — Forensic Analysis (226 Txns · 13 Layers)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080c18;--panel:#0f1629;--border:rgba(255,255,255,0.08);
    --text:#f1f5f9;--muted:#64748b;--accent:#3b82f6;
    --success:#10b981;--danger:#ef4444;--warn:#f59e0b;
    --purple:#8b5cf6;
  }
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  
  /* TOP BAR */
  header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
  header h1{font-size:1rem;font-weight:700;letter-spacing:.5px;}
  header h1 span{color:var(--danger);font-family:'JetBrains Mono',monospace;}
  .stats{display:flex;gap:20px;margin-left:auto;font-size:.8rem;color:var(--muted);}
  .stat strong{color:var(--text);font-family:'JetBrains Mono',monospace;}

  /* LEGEND */
  .legend{display:flex;gap:16px;padding:10px 24px;background:rgba(15,22,41,.8);border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:.78rem;color:var(--muted);}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;}

  /* CONTROLS */
  .controls{position:absolute;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:20;}
  .btn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .btn:hover{background:var(--accent);border-color:var(--accent);}

  /* CANVAS */
  #graph-container{flex:1;position:relative;overflow-x:hidden;overflow-y:auto;}
  svg{width:100%;display:block;overflow:visible;}

  /* LAYER LABELS */
  .layer-label{font-family:'JetBrains Mono',monospace;font-size:11px;fill:var(--muted);text-anchor:middle;}

  /* EDGES */
  .edge{fill:none;opacity:.45;transition:opacity .2s,stroke-width .2s;}
  .edge:hover{opacity:1;}
  .edge-success{stroke:var(--success);}
  .edge-disputed{stroke:var(--danger);}
  .edge-neutral{stroke:var(--purple);}

  /* NODES */
  .node-group{cursor:pointer;}
  .node-rect{rx:10;ry:10;stroke-width:1.5;}
  .node-title{font-size:9px;font-family:'JetBrains Mono',monospace;fill:var(--accent);}
  .node-bank{font-size:9px;fill:var(--muted);}
  .node-highlight .node-rect{stroke:var(--warn)!important;filter:drop-shadow(0 0 8px rgba(245,158,11,.7));}

  /* TOOLTIP */
  #tooltip{
    position:absolute;pointer-events:none;
    background:rgba(10,14,28,.95);
    border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;
    font-size:.8rem;max-width:300px;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    display:none;z-index:100;
  }
  #tooltip h3{font-size:.85rem;color:var(--accent);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  #tooltip .row{display:flex;justify-content:space-between;gap:12px;margin:4px 0;color:var(--muted);}
  #tooltip .row span{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.75rem;text-align:right;}
  #tooltip .amount-val{color:var(--warn);font-weight:700;}
  #tooltip .disputed-val{color:var(--danger);font-weight:700;}
  
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--muted);}
</style>
</head>
<body>

<header>
  <div style="width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger);"></div>
  <h1>Forensic Money Trail — <span>TOON</span> Flow Graph</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="legend">
  <div class="legend-item"><div class="dot" style="background:var(--success)"></div> Successful</div>
  <div class="legend-item"><div class="dot" style="background:var(--danger)"></div> Disputed</div>
  <div class="legend-item"><div class="dot" style="background:var(--purple)"></div> Pending/Other</div>
  <div class="legend-item" style="margin-left:12px;color:var(--muted)">Click node to highlight paths &nbsp;|&nbsp; Scroll to zoom &nbsp;|&nbsp; Drag to pan</div>
</div>

<div id="graph-container">
  <div class="loading" id="loading">Loading transaction graph...</div>
  <svg id="svg"></svg>
</div>

<div id="tooltip"></div>

<div class="controls">
  <button class="btn" id="btn-zoom-in" title="Zoom In">+</button>
  <button class="btn" id="btn-zoom-out" title="Zoom Out">−</button>
  <button class="btn" id="btn-reset" title="Reset View">⌖</button>
</div>

<script>
// ─── DATA PROCESSING ────────────────────────────────────────────────────
async function loadData() {
  const res = await fetch('Refined_TOON_Report.json');
  const json = await res.json();
  // Path: root.sections.layered_transactions
  return (json.sections && json.sections.layered_transactions) || json.layered_transactions || [];
}

function processGraph(txns) {
  const nodeMap = new Map();   // key → {id, account, bank, layer, txCount}
  const edges = [];

  function getOrCreateNode(account, bank, layer) {
    const key = account.trim();
    if (!nodeMap.has(key)) {
      nodeMap.set(key, { id: key, account: key, bank: bank || '', layer: parseInt(layer) || 1, txCount: 0 });
    }
    const n = nodeMap.get(key);
    if (bank && !n.bank) n.bank = bank;
    if (parseInt(layer) < n.layer) n.layer = parseInt(layer); // assign to earliest layer
    return n;
  }

  txns.forEach(t => {
    const src = getOrCreateNode(t.source_account, t.bank, t.layer);
    const dst = getOrCreateNode(t.destination_account, t.action_by, parseInt(t.layer) + 1);
    src.txCount++;
    
    const amtNum = parseFloat((t.amount || '0').replace(/,/g, '')) || 0;
    const dispNum = parseFloat((t.disputed_amount || '0').replace(/,/g, '')) || 0;
    const isSuccess = (t.remarks || '').toUpperCase().includes('SUCCESS');
    const isDisputed = dispNum > 0 && dispNum === amtNum;

    edges.push({
      source: src.id,
      target: dst.id,
      amount: t.amount || '0',
      disputed_amount: t.disputed_amount || '0',
      utr: t.transaction_utr || '',
      datetime: t.datetime || '',
      remarks: t.remarks || '',
      layer: parseInt(t.layer) || 1,
      amtNum,
      isSuccess,
      isDisputed,
      sno: t.sno
    });
  });

  return { nodes: Array.from(nodeMap.values()), edges };
}

// ─── RENDERING ──────────────────────────────────────────────────────────
function render(nodes, edges) {
  const container = document.getElementById('graph-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  document.getElementById('loading').style.display = 'none';

  // Stats
  const layers = [...new Set(nodes.map(n => n.layer))].sort((a,b) => a-b);
  const totalAmt = edges.reduce((s, e) => s + e.amtNum, 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat">Nodes <strong>${nodes.length}</strong></div>
    <div class="stat">Transactions <strong>${edges.length}</strong></div>
    <div class="stat">Layers <strong>${layers.length}</strong></div>
    <div class="stat">Total ₹<strong>${(totalAmt/100000).toFixed(1)}L</strong></div>
  `;

  // ── Layout: HORIZONTAL within layer, VERTICAL between layers ──
  const NODE_W = 160, NODE_H = 52;
  const LAYER_H = 180;    // fixed vertical gap between layers
  const NODE_GAP = 20;   // horizontal gap between sibling nodes

  const layerNodes = {};
  layers.forEach(l => { layerNodes[l] = nodes.filter(n => n.layer === l); });

  // Each layer is independently centered on its own row.
  // VIRTUAL_W is set by the widest layer so the canvas fits all nodes.
  const maxNodesInLayer = Math.max(...layers.map(l => layerNodes[l].length));
  // Cap at 60 nodes visible per layer to avoid extreme width; extras will need pan/zoom
  const cappedMax = Math.min(maxNodesInLayer, 60);
  const VIRTUAL_W = Math.max(1400, cappedMax * (NODE_W + NODE_GAP) + 120);
  const VIRTUAL_H = 80 + layers.length * LAYER_H + 80;

  nodes.forEach(node => {
    const l = node.layer;
    const peers = layerNodes[l];
    const idx   = peers.indexOf(node);
    const count = peers.length;

    // X: center this layer's row independently inside VIRTUAL_W
    const rowW   = count * NODE_W + (count - 1) * NODE_GAP;
    const startX = (VIRTUAL_W - rowW) / 2;
    node.x = startX + idx * (NODE_W + NODE_GAP) + NODE_W / 2;

    // Y: each layer sits at a fixed vertical slot
    node.y = 80 + (l - layers[0]) * LAYER_H + LAYER_H / 2;
  });

  // ── SVG Setup ──
  const svg = d3.select('#svg');
  svg.selectAll('*').remove();
  // No viewBox — use raw pixel coords, D3 zoom handles transforms
  svg.attr('viewBox', null);

  const defs = svg.append('defs');
  ['success','disputed','neutral'].forEach(type => {
    const color = type === 'success' ? '#10b981' : type === 'disputed' ? '#ef4444' : '#8b5cf6';
    defs.append('marker')
      .attr('id', `arrow-${type}`)
      .attr('viewBox', '0 -5 10 10').attr('refX', 22).attr('refY', 0)
      .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto')
      .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', color);
  });

  const g = svg.append('g').attr('class', 'main-group');

  // ── Zoom + Pan ──
  const zoom = d3.zoom().scaleExtent([0.05, 4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  // Fit-to-width: zoom so widest layer fills the screen, then scroll vertically
  const initScale = (W / VIRTUAL_W) * 0.96;
  const tx = (W - VIRTUAL_W * initScale) / 2;
  const ty = 20;
  const initTransform = d3.zoomIdentity.translate(tx, ty).scale(initScale);
  g.attr('transform', initTransform);
  zoom.transform(svg, initTransform);

  // Also set the SVG height to match the scaled virtual height so content isn't clipped
  const scaledH = VIRTUAL_H * initScale + 40;
  document.getElementById('graph-container').style.minHeight = scaledH + 'px';

  document.getElementById('btn-zoom-in').onclick  = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  document.getElementById('btn-zoom-out').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  document.getElementById('btn-reset').onclick    = () => svg.transition().duration(500).call(zoom.transform, initTransform);

  // ── Layer bands (full virtual width) ──
  const LAYER_COLORS = [
    'rgba(239,68,68,0.07)','rgba(245,158,11,0.07)','rgba(139,92,246,0.07)',
    'rgba(59,130,246,0.07)','rgba(16,185,129,0.07)','rgba(236,72,153,0.07)',
    'rgba(6,182,212,0.07)','rgba(132,204,22,0.07)','rgba(251,146,60,0.07)',
    'rgba(99,102,241,0.07)','rgba(20,184,166,0.07)','rgba(217,70,239,0.07)',
    'rgba(234,179,8,0.07)'
  ];
  const LAYER_STROKE = [
    '#ef4444','#f59e0b','#8b5cf6','#3b82f6','#10b981','#ec4899',
    '#06b6d4','#84cc16','#fb923c','#6366f1','#14b8a6','#d946ef','#eab308'
  ];

  const bandGroup = g.append('g').attr('class', 'bands');
  layers.forEach((l, li) => {
    const y = 80 + (l - layers[0]) * LAYER_H;
    bandGroup.append('rect')
      .attr('x', 0).attr('y', y - LAYER_H/2 + 4)
      .attr('width', VIRTUAL_W).attr('height', LAYER_H)
      .attr('fill', LAYER_COLORS[li % LAYER_COLORS.length])
      .attr('rx', 0);
    // Left pill label
    bandGroup.append('rect')
      .attr('x', 8).attr('y', y - 10)
      .attr('width', 62).attr('height', 20)
      .attr('rx', 10)
      .attr('fill', LAYER_STROKE[li % LAYER_STROKE.length])
      .attr('opacity', 0.18);
    bandGroup.append('text').attr('class', 'layer-label')
      .attr('x', 39).attr('y', y + 5)
      .attr('fill', LAYER_STROKE[li % LAYER_STROKE.length])
      .attr('font-weight', '700')
      .text(`L-${l}`);
  });

  // Build node lookup
  const nodeById = {};
  nodes.forEach(n => { nodeById[n.id] = n; });

  // ── Edge paths (curved) ──
  const edgeGroup = g.append('g').attr('class', 'edges');
  const edgeEls = edgeGroup.selectAll('.edge-path')
    .data(edges).enter().append('g').attr('class', 'edge-g');

  // Log-scale stroke width by amount (min 1.5px, max 6px)
  const amtExtent = d3.extent(edges, d => d.amtNum);
  const strokeScale = d3.scaleLog()
    .domain([Math.max(1, amtExtent[0]), Math.max(2, amtExtent[1])])
    .range([1.5, 6]).clamp(true);

  edgeEls.append('path')
    .attr('class', d => `edge ${d.isSuccess ? 'edge-success' : d.isDisputed ? 'edge-disputed' : 'edge-neutral'}`)
    .attr('stroke-width', d => strokeScale(Math.max(1, d.amtNum)))
    .attr('marker-end', d => `url(#arrow-${d.isSuccess ? 'success' : d.isDisputed ? 'disputed' : 'neutral'})`)
    .attr('d', d => {
      const s = nodeById[d.source], t = nodeById[d.target];
      if (!s || !t) return '';
      // Cubic bezier: exit bottom of source, enter top of destination
      const sy = s.y + NODE_H / 2;
      const ty = t.y - NODE_H / 2;
      const bend = Math.max(40, Math.abs(ty - sy) * 0.4);
      return `M${s.x},${sy} C${s.x},${sy + bend} ${t.x},${ty - bend} ${t.x},${ty}`;
    });

  // ── Nodes ──
  const nodeGroup = g.append('g').attr('class', 'nodes');

  const nodeEls = nodeGroup.selectAll('.node-group')
    .data(nodes).enter().append('g')
    .attr('class', 'node-group')
    .attr('transform', d => `translate(${d.x - NODE_W/2},${d.y - NODE_H/2})`)
    .on('click', (e, d) => highlightNode(d, nodeEls, edgeEls))
    .on('mouseenter', (e, d) => showNodeTooltip(e, d, edges))
    .on('mouseleave', hideTooltip);

  nodeEls.append('rect')
    .attr('class', 'node-rect')
    .attr('width', NODE_W).attr('height', NODE_H)
    .attr('fill', d => LAYER_COLORS[(d.layer - layers[0]) % LAYER_COLORS.length])
    .attr('stroke', d => LAYER_STROKE[(d.layer - layers[0]) % LAYER_STROKE.length]);

  // Icon circle
  nodeEls.append('circle')
    .attr('cx', 20).attr('cy', NODE_H/2).attr('r', 8)
    .attr('fill', d => LAYER_STROKE[(d.layer - layers[0]) % LAYER_STROKE.length])
    .attr('opacity', 0.5);

  nodeEls.append('text').attr('class','node-title')
    .attr('x', 36).attr('y', 20)
    .text(d => d.account.length > 16 ? d.account.slice(0,16)+'…' : d.account);

  nodeEls.append('text').attr('class','node-bank')
    .attr('x', 36).attr('y', 36)
    .text(d => {
      const b = d.bank || '';
      return b.length > 20 ? b.slice(0, 20)+'…' : b;
    });

  // Tx count badge (top-right)
  nodeEls.filter(d => d.txCount > 0).append('circle')
    .attr('cx', NODE_W - 10).attr('cy', 10).attr('r', 9)
    .attr('fill', d => LAYER_STROKE[(d.layer - layers[0]) % LAYER_STROKE.length])
    .attr('opacity', 0.8);
  nodeEls.filter(d => d.txCount > 0).append('text')
    .attr('x', NODE_W - 10).attr('y', 14)
    .attr('text-anchor','middle').attr('font-size','8px')
    .attr('fill','#fff').attr('font-weight','700')
    .text(d => d.txCount);

  // Edge hover tooltip
  edgeEls.on('mouseenter', (e, d) => showEdgeTooltip(e, d))
         .on('mouseleave', hideTooltip);
}

// ─── HIGHLIGHT ──────────────────────────────────────────────────────────
let selectedNode = null;
function highlightNode(d, nodeEls, edgeEls) {
  if (selectedNode === d.id) {
    selectedNode = null;
    nodeEls.classed('node-highlight', false).attr('opacity', 1);
    edgeEls.attr('opacity', 1);
    return;
  }
  selectedNode = d.id;
  nodeEls.classed('node-highlight', n => n.id === d.id).attr('opacity', n => n.id === d.id ? 1 : 0.3);
  edgeEls.attr('opacity', e => (e.source === d.id || e.target === d.id) ? 1 : 0.1);
}

// ─── TOOLTIPS ───────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showEdgeTooltip(e, d) {
  const amtClass = d.isDisputed ? 'disputed-val' : 'amount-val';
  tooltip.innerHTML = `
    <h3>Transaction #${d.sno} — Layer ${d.layer}</h3>
    <div class="row">Amount <span class="${amtClass}">₹${d.amount}</span></div>
    <div class="row">Disputed <span class="disputed-val">₹${d.disputed_amount}</span></div>
    <div class="row">UTR <span>${d.utr}</span></div>
    <div class="row">Date <span>${d.datetime}</span></div>
    <div class="row">Remarks <span>${d.remarks || '—'}</span></div>
  `;
  positionTooltip(e);
}
function showNodeTooltip(e, d, edges) {
  const out = edges.filter(x => x.source === d.id);
  const inn = edges.filter(x => x.target === d.id);
  const totalOut = out.reduce((s,x) => s + x.amtNum, 0);
  tooltip.innerHTML = `
    <h3>Account Node</h3>
    <div class="row">Account <span>${d.account}</span></div>
    <div class="row">Bank <span>${d.bank || '—'}</span></div>
    <div class="row">Layer <span>${d.layer}</span></div>
    <div class="row">Inflow txns <span>${inn.length}</span></div>
    <div class="row">Outflow txns <span>${out.length}</span></div>
    <div class="row">Total outflow <span class="amount-val">₹${totalOut.toLocaleString('en-IN')}</span></div>
  `;
  positionTooltip(e);
}
function positionTooltip(e) {
  tooltip.style.display = 'block';
  const x = e.clientX + 12;
  const y = e.clientY - 20;
  tooltip.style.left = Math.min(x, window.innerWidth - 320) + 'px';
  tooltip.style.top = Math.max(10, y) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

// ─── INIT ────────────────────────────────────────────────────────────────
(async () => {
  try {
    const txns = await loadData();
    const { nodes, edges } = processGraph(txns);
    render(nodes, edges);
  } catch(err) {
    document.getElementById('loading').textContent = '⚠ Error: ' + err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
